name: Mutation
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/SharpSafeNumerics.Core/**'
      - 'tests/SharpSafeNumerics.UnitTests/**'
      - 'stryker-config.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '17 10 * * 1'
jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore
      - run: dotnet test tests/SharpSafeNumerics.UnitTests -c Release
      - name: Stryker.NET
        working-directory: src/SharpSafeNumerics.Core
        run: dotnet stryker --config-file ../../stryker-config.json --concurrency 4 --output ../../StrykerOutput
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: StrykerOutput
          if-no-files-found: ignore
