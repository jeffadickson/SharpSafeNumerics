name: Core CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Exhaustive deterministic harness
        run: dotnet run --project tests/SharpSafeNumerics.Tests -c Release
      - name: Unit tests
        run: dotnet test tests/SharpSafeNumerics.UnitTests -c Release --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: artifacts/coverage
      - name: CsCheck and Hedgehog
        run: dotnet run --project tests/SharpSafeNumerics.PropertyTests -c Release
      - name: Generated annotated domain
        run: dotnet run --project examples/GeneratedQueueDepth -c Release
      - name: Static range-policy example
        run: dotnet run --project examples/RiscueQueueDepth -c Release
      - name: Analyzer self-test
        run: dotnet run --project tests/SharpSafeNumerics.AnalyzerTests -c Release
      - name: Compile C# 15 union adapter
        run: dotnet build src/SharpSafeNumerics.Unions -c Release
      - name: Native AOT smoke
        run: |
          dotnet publish tests/SharpSafeNumerics.AotSmoke -c Release -r linux-x64 -o artifacts/aot
          ./artifacts/aot/SharpSafeNumerics.AotSmoke

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - name: Verify Dafny arithmetic model
        run: dotnet tool run dafny -- verify formal/SafeInteger.dfy --solver-path $(which z3)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate StrictDoc requirements
        run: |
          python -m pip install --no-compile strictdoc==0.30.4
          strictdoc export docs/requirements.sdoc --output-dir artifacts/requirements
