name: Core CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Exhaustive deterministic harness
        run: dotnet run --project tests/SharpSafeNumerics.Tests -c Release
      - name: Verify interactive guide package fixtures
        run: dotnet run --project eng/DeepDiveEvidence -c Release -- --verify docs/interactive-deep-dive.html
      - name: Unit tests
        run: dotnet test tests/SharpSafeNumerics.UnitTests -c Release --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - name: Generator contract tests
        run: dotnet test tests/SharpSafeNumerics.GeneratorTests -c Release --collect:"XPlat Code Coverage" --results-directory artifacts/generator-coverage
      - name: Analyzer contract tests
        run: dotnet test tests/SharpSafeNumerics.AnalyzerUnitTests -c Release --collect:"XPlat Code Coverage" --results-directory artifacts/analyzer-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            artifacts/coverage
            artifacts/generator-coverage
            artifacts/analyzer-coverage
      - name: CsCheck and Hedgehog
        run: dotnet run --project tests/SharpSafeNumerics.PropertyTests -c Release
      - name: Generated annotated domain
        run: dotnet run --project examples/GeneratedQueueDepth -c Release
      - name: Static range-policy example
        run: dotnet run --project examples/RiscueQueueDepth -c Release
      - name: Analyzer self-test
        run: dotnet run --project tests/SharpSafeNumerics.AnalyzerTests -c Release
      - name: Compile C# 15 union adapter
        run: dotnet build src/SharpSafeNumerics.Unions -c Release
      - name: Native AOT smoke
        run: |
          dotnet publish tests/SharpSafeNumerics.AotSmoke -c Release -r linux-x64 -o artifacts/aot
          ./artifacts/aot/SharpSafeNumerics.AotSmoke
      - name: Pack RC libraries and compiler extensions
        run: dotnet pack -c Release -o artifacts/packages
      - name: Verify reproducible package archives
        shell: pwsh
        run: ./eng/VerifyPackageReproducibility.ps1 -ArtifactDirectory artifacts/reproducibility -RebuildBetweenPasses
      - name: Verify package consumer and packaged analyzer
        shell: pwsh
        run: ./eng/VerifyPackages.ps1 -PackageDirectory (Join-Path $PWD 'artifacts/packages') -WorkDirectory (Join-Path $PWD 'artifacts/package-consumer')
      - uses: actions/upload-artifact@v4
        with:
          name: rc-packages
          path: artifacts/packages

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - name: Verify Dafny arithmetic model
        run: dotnet tool run dafny -- verify formal/SafeInteger.dfy --solver-path $(which z3)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate StrictDoc requirements
        run: |
          python -m pip install --no-compile strictdoc==0.30.4
          strictdoc export docs/requirements.sdoc docs/generator-requirements.sdoc docs/analyzer-requirements.sdoc --output-dir artifacts/requirements
