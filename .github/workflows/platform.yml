name: Platform Qualification
on:
  workflow_dispatch:
    inputs:
      includeMac:
        description: 'Run the explicitly enabled one-time macOS qualification'
        type: boolean
        default: false
  push:
    paths:
      - 'src/**'
      - 'tests/SharpSafeNumerics.AotSmoke/**'
      - '.github/workflows/platform.yml'
jobs:
  platform:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: ./artifacts/aot/SharpSafeNumerics.AotSmoke
          - os: windows-latest
            rid: win-x64
            exe: artifacts/aot/SharpSafeNumerics.AotSmoke.exe
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: ./artifacts/aot/SharpSafeNumerics.AotSmoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish tests/SharpSafeNumerics.AotSmoke -c Release -r ${{ matrix.rid }} -o artifacts/aot
      - name: Run native smoke
        run: ${{ matrix.exe }}
  avx512-dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Check dispatch and fallback on the same runner
        shell: pwsh
        run: |
          $project = 'tests/SharpSafeNumerics.UnitTests'
          $coverage = 'artifacts/batch-coverage'
          $flags = (Get-Content -LiteralPath /proc/cpuinfo | Select-String '^flags\s*:' | Select-Object -First 1).Line
          Write-Host $flags
          if ($flags -match '\bavx512f\b') {
            $env:DOTNET_EnableAVX512 = '1'
            $env:SSN_REQUIRED_BATCH_WIDTH = '512'
            dotnet test $project -c Release --filter FullyQualifiedName~BatchArithmeticTests --collect:"XPlat Code Coverage" --results-directory $coverage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Path artifacts/hardware-proof | Out-Null
            Set-Content -LiteralPath artifacts/hardware-proof/verified-512.txt -Value 'Actual SIMD512 and lane oracle verified'
          }
          $env:DOTNET_EnableAVX512 = '0'
          $env:SSN_REQUIRED_BATCH_WIDTH = '256'
          dotnet test $project -c Release --filter FullyQualifiedName~BatchArithmeticTests --collect:"XPlat Code Coverage" --results-directory $coverage
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-dispatch-${{ matrix.probe }}
          path: artifacts/batch-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-proof-${{ matrix.probe }}
          path: artifacts/hardware-proof/verified-512.txt
          if-no-files-found: ignore
  avx512-proof:
    needs: avx512-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hardware-proof-*
          path: hardware-proof
      - name: Require actual AVX-512 execution on at least one runner
        run: test -d hardware-proof && find hardware-proof -name verified-512.txt -print -quit | grep -q .
  windows-x86-managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Qualify actual managed x86 host
        shell: pwsh
        run: ./eng/Invoke-X86Qualification.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'SharpSafeNumerics-x86')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x86-managed-evidence
          path: |
            ${{ runner.temp }}/SharpSafeNumerics-x86/summary.json
            ${{ runner.temp }}/SharpSafeNumerics-x86/source-sha256.json
            ${{ runner.temp }}/SharpSafeNumerics-x86/*.log
            ${{ runner.temp }}/SharpSafeNumerics-x86/*-results/*.trx
          if-no-files-found: ignore
  mac-once:
    if: github.event_name == 'workflow_dispatch' && inputs.includeMac && vars.ENABLE_MAC_QUALIFICATION == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish tests/SharpSafeNumerics.AotSmoke -c Release -r osx-arm64 -o artifacts/aot
      - run: ./artifacts/aot/SharpSafeNumerics.AotSmoke
